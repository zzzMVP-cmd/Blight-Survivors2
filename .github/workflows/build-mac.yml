name: 构建 macOS 安装包

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac-universal:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=Blight-Survivors2-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 打包 universal dmg 与 zip
        run: |
          set -o pipefail
          npm run dist:mac 2>&1 | tee build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 列出产物
        run: ls -lh release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BlightSurvivors2-mac-universal
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: 发布 dmg 到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: release/*.dmg
          fail_on_unmatched_files: true

      - name: 上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore