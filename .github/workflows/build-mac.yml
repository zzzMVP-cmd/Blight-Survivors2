name: 构建 macOS 安装包

on:
  workflow_dispatch:

jobs:
  mac-universal:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包 universal dmg 与 zip
        run: |
          set -o pipefail
          npm run dist:mac 2>&1 | tee build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 列出产物
        run: ls -lh release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BlightSurvivors2-mac-universal
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      - name: 上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore